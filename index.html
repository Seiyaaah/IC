<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning OS v2.5 Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
    <!-- MANDATORY DATA LOADING -->
    <script src="reviewerData.js"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

    <div id="app-root" class="h-full flex flex-col">
        <!-- Error Overlay -->
        <div id="error-screen" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-8 shadow-2xl text-center">
                <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold"><i class="bi bi-exclamation-triangle"></i></div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Reviewer Data Missing or Invalid</h2>
                <p id="error-message" class="text-slate-600 dark:text-slate-400 mb-6 text-sm leading-relaxed">The required <code class="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-xs">reviewerData.js</code> script was not detected or does not contain a valid subjects array. Please ensure the file is present in the root directory.</p>
                <button onclick="location.reload()" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-medium px-6 py-2.5 rounded-xl hover:opacity-90 transition-opacity text-sm">Reload Application</button>
            </div>
        </div>

        <!-- Main Shell -->
        <div id="app-shell" class="hidden h-full flex flex-col md:flex-row overflow-hidden">
            <div id="sidebar-backdrop" onclick="App.toggleMobileSidebar()" class="fixed inset-0 z-30 bg-slate-900/50 backdrop-blur-xs hidden md:hidden"></div>

            <!-- Sidebar -->
            <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
                <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="Router.navigate('dashboard')">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-emerald-700 flex items-center justify-center text-white font-bold shadow-lg shadow-brand-500/20 text-lg">Λ</div>
                        <div>
                            <h1 class="font-bold text-base leading-tight tracking-tight">Learning OS</h1>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">v2.5 Professional</span>
                        </div>
                    </div>
                    <button onclick="App.toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                        <i class="bi bi-x-lg text-lg"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto px-4 py-4 space-y-6">
                    <div>
                        <div class="px-3 mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Overview</div>
                        <nav class="space-y-1">
                            <button onclick="Router.navigate('dashboard')" data-nav="dashboard" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
                                <i class="bi bi-grid-1x2 text-base"></i>
                                <span>Dashboard</span>
                            </button>
                            <button onclick="Router.navigate('subjects')" data-nav="subjects" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
                                <i class="bi bi-journal-bookmark text-base"></i>
                                <span>Subjects & Lessons</span>
                            </button>
                            <button onclick="Router.navigate('bookmarks')" data-nav="bookmarks" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
                                <i class="bi bi-bookmark-star text-base"></i>
                                <span>Bookmarks & Favorites</span>
                            </button>
                            <button onclick="Router.navigate('stats')" data-nav="stats" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
                                <i class="bi bi-bar-chart-line text-base"></i>
                                <span>Study Statistics</span>
                            </button>
                        </nav>
                    </div>

                    <div>
                        <div class="px-3 mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Quick Filters</div>
                        <div id="sidebar-subject-list" class="space-y-1"></div>
                    </div>
                </div>

                <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <button onclick="ThemeManager.toggle()" class="flex items-center space-x-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i class="bi bi-sun-fill hidden dark:inline text-sm"></i>
                        <i class="bi bi-moon-fill inline dark:hidden text-sm"></i>
                        <span>Toggle Theme</span>
                    </button>
                    <button onclick="Router.navigate('settings')" class="p-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Settings">
                        <i class="bi bi-gear text-base"></i>
                    </button>
                </div>
            </aside>

            <!-- Main Content Container -->
            <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 md:px-8 z-20 shrink-0">
                    <div class="flex items-center space-x-3">
                        <button onclick="App.toggleMobileSidebar()" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                            <i class="bi bi-list text-xl"></i>
                        </button>
                        <div class="relative w-64 md:w-96">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="bi bi-search text-sm"></i>
                            </span>
                            <input type="text" id="global-search-input" oninput="SearchEngine.handleInput(this.value)" placeholder="Search subjects, lessons, flashcards, questions..." class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-800/60 border border-transparent focus:border-brand-500 rounded-xl text-sm focus:outline-none transition-colors">
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <div class="hidden sm:flex items-center space-x-1.5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/50 px-3 py-1.5 rounded-full text-xs font-semibold text-amber-700 dark:text-amber-400">
                            <i class="bi bi-fire text-amber-500"></i>
                            <span id="streak-counter-badge">3 Day Streak</span>
                        </div>
                        <button onclick="Router.navigate('settings')" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Settings">
                            <i class="bi bi-bell text-lg"></i>
                        </button>
                    </div>
                </header>

                <main id="view-container" class="flex-1 overflow-y-auto bg-slate-50 dark:bg-slate-950 p-4 md:p-8"></main>
            </div>
        </div>
    </div>

    <!-- Modal System -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white mb-2">Notice</h3>
            <p id="modal-message" class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed"></p>
            <div class="flex justify-end space-x-3">
                <button onclick="App.closeModal()" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-medium px-4 py-2 rounded-xl text-sm hover:opacity-90">OK</button>
            </div>
        </div>
    </div>

    <script>
        const IconRenderer = {
            render(iconInput, fallback = 'bi-book') {
                if (!iconInput || typeof iconInput !== 'string') {
                    return `<i class="bi ${fallback}"></i>`;
                }
                const trimmed = iconInput.trim();
                if (trimmed.startsWith('bi-') || trimmed.includes('bi ')) {
                    const cls = trimmed.startsWith('bi-') ? `bi ${trimmed}` : trimmed;
                    return `<i class="${cls}"></i>`;
                }
                if (/^[a-zA-Z0-9_-]+$/.test(trimmed) && !trimmed.includes(' ') && !/\p{Extended_Pictographic}/u.test(trimmed)) {
                    return `<i class="bi bi-${trimmed}"></i>`;
                }
                return `<span>${trimmed}</span>`;
            }
        };

        const StorageManager = {
            prefix: 'learning_os_v2.5_',
            get(key, fallback = null) {
                try {
                    const item = localStorage.getItem(this.prefix + key);
                    return item ? JSON.parse(item) : fallback;
                } catch (e) {
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch (e) {
                    return false;
                }
            }
        };

        const ThemeManager = {
            init() {
                const saved = StorageManager.get('theme', 'system');
                this.apply(saved);
            },
            apply(theme) {
                const root = document.documentElement;
                if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
                StorageManager.set('theme', theme);
            },
            toggle() {
                const isDark = document.documentElement.classList.contains('dark');
                this.apply(isDark ? 'light' : 'dark');
            }
        };

        const DataManager = {
            data: null,
            subjectsIndex: new Map(),
            lessonsIndex: new Map(),
            flashcardsIndex: new Map(),
            questionsIndex: new Map(),

            init() {
                if (typeof window.reviewerData === 'undefined' || !window.reviewerData || !Array.isArray(window.reviewerData.subjects)) {
                    return false;
                }
                this.data = window.reviewerData;
                this.buildIndexes();
                return true;
            },

            buildIndexes() {
                this.subjectsIndex.clear();
                this.lessonsIndex.clear();
                this.flashcardsIndex.clear();
                this.questionsIndex.clear();

                this.data.subjects.forEach((subject, sIdx) => {
                    const subjectId = subject.id || `subject_${sIdx}`;
                    subject.id = subjectId;
                    this.subjectsIndex.set(subjectId, subject);

                    if (Array.isArray(subject.lessons)) {
                        subject.lessons.forEach((lesson, lIdx) => {
                            const lessonId = lesson.id || `${subjectId}_lesson_${lIdx}`;
                            lesson.id = lessonId;
                            lesson.subjectId = subjectId;
                            this.lessonsIndex.set(lessonId, lesson);

                            if (Array.isArray(lesson.flashcards)) {
                                lesson.flashcards.forEach((fc, fIdx) => {
                                    fc.id = fc.id || `${lessonId}_fc_${fIdx}`;
                                    fc.lessonId = lessonId;
                                    this.flashcardsIndex.set(fc.id, fc);
                                });
                            }

                            if (Array.isArray(lesson.questions)) {
                                lesson.questions.forEach((q, qIdx) => {
                                    q.id = q.id || `${lessonId}_q_${qIdx}`;
                                    q.lessonId = lessonId;
                                    this.questionsIndex.set(q.id, q);
                                });
                            }
                        });
                    }
                });
            },

            getSubjects() { return this.data ? this.data.subjects : []; },
            getSubject(id) { return this.subjectsIndex.get(id); },
            getLesson(id) { return this.lessonsIndex.get(id); }
        };

        const ProgressManager = {
            getState() {
                return StorageManager.get('progress_state', {
                    completedLessons: {},
                    bookmarks: { subjects: {}, lessons: {}, flashcards: {}, questions: {} },
                    favorites: { subjects: {}, lessons: {}, flashcards: {}, questions: {} },
                    quizHistory: [],
                    studyTimeMinutes: 45,
                    streak: 3
                });
            },
            save(state) { StorageManager.set('progress_state', state); },
            toggleBookmark(type, id) {
                const state = this.getState();
                state.bookmarks[type][id] = !state.bookmarks[type][id];
                this.save(state);
                App.showToast(state.bookmarks[type][id] ? 'Bookmarked successfully' : 'Bookmark removed');
                Router.refreshCurrent();
            },
            toggleFavorite(type, id) {
                const state = this.getState();
                state.favorites[type][id] = !state.favorites[type][id];
                this.save(state);
                App.showToast(state.favorites[type][id] ? 'Added to favorites' : 'Removed from favorites');
                Router.refreshCurrent();
            },
            isBookmarked(type, id) { return !!this.getState().bookmarks[type]?.[id]; },
            isFavorite(type, id) { return !!this.getState().favorites[type]?.[id]; },
            markLessonComplete(lessonId, completed = true) {
                const state = this.getState();
                state.completedLessons[lessonId] = completed;
                this.save(state);
            },
            recordQuizResult(result) {
                const state = this.getState();
                state.quizHistory.unshift({ ...result, date: new Date().toISOString() });
                this.save(state);
            }
        };

        const ContentRenderer = {
            render(content) {
                if (!content) return '<p class="text-slate-500 italic">No content available for this lesson.</p>';
                if (typeof content === 'string') {
                    return content.split('\n\n').map(p => `<p class="mb-4 leading-relaxed text-slate-700 dark:text-slate-300">${p}</p>`).join('');
                }
                if (!Array.isArray(content)) return '<p class="text-slate-500 italic">Invalid content format.</p>';

                return content.map(block => {
                    try {
                        switch (block.type) {
                            case 'heading': return this.renderHeading(block);
                            case 'paragraph': return this.renderParagraph(block);
                            case 'definition': return this.renderDefinition(block);
                            case 'note': return this.renderNote(block);
                            case 'warning': return this.renderWarning(block);
                            case 'tip': return this.renderTip(block);
                            case 'example': return this.renderExample(block);
                            case 'summary': return this.renderSummary(block);
                            case 'list': return this.renderList(block);
                            case 'table': return this.renderTable(block);
                            case 'formula': return this.renderFormula(block);
                            case 'quote': return this.renderQuote(block);
                            case 'code': return this.renderCode(block);
                            default:
                                console.warn('Unknown block type:', block.type);
                                return '';
                        }
                    } catch (err) {
                        return '';
                    }
                }).join('');
            },
            renderHeading(b) {
                const level = b.level || 2;
                const sizes = { 1: 'text-3xl font-bold mt-8 mb-4', 2: 'text-2xl font-bold mt-6 mb-3', 3: 'text-xl font-semibold mt-5 mb-2', 4: 'text-lg font-semibold mt-4 mb-2' };
                return `<h${level} class="${sizes[level] || sizes[2]} text-slate-900 dark:text-white tracking-tight">${b.text}</h${level}>`;
            },
            renderParagraph(b) { return `<p class="mb-4 text-slate-700 dark:text-slate-300 leading-relaxed text-base">${b.text}</p>`; },
            renderDefinition(b) { return `<div class="my-6 p-5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-900/50 shadow-xs"><div class="flex items-center space-x-2 text-indigo-700 dark:text-indigo-400 font-semibold mb-1 text-sm uppercase tracking-wider"><i class="bi bi-book"></i><span>Definition: ${b.term || ''}</span></div><p class="text-slate-800 dark:text-slate-200 text-base leading-relaxed">${b.text || b.definition}</p></div>`; },
            renderNote(b) { return `<div class="my-6 p-5 rounded-2xl bg-sky-50 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900/50 text-slate-800 dark:text-slate-200"><div class="flex items-center space-x-2 text-sky-700 dark:text-sky-400 font-semibold mb-1 text-sm uppercase tracking-wider"><i class="bi bi-info-circle"></i><span>Note</span></div><p class="text-sm leading-relaxed">${b.text}</p></div>`; },
            renderWarning(b) { return `<div class="my-6 p-5 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 text-slate-800 dark:text-slate-200"><div class="flex items-center space-x-2 text-amber-700 dark:text-amber-400 font-semibold mb-1 text-sm uppercase tracking-wider"><i class="bi bi-exclamation-triangle"></i><span>Warning</span></div><p class="text-sm leading-relaxed">${b.text}</p></div>`; },
            renderTip(b) { return `<div class="my-6 p-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900/50 text-slate-800 dark:text-slate-200"><div class="flex items-center space-x-2 text-emerald-700 dark:text-emerald-400 font-semibold mb-1 text-sm uppercase tracking-wider"><i class="bi bi-lightbulb"></i><span>Pro Tip</span></div><p class="text-sm leading-relaxed">${b.text}</p></div>`; },
            renderExample(b) { return `<div class="my-6 p-5 rounded-2xl bg-purple-50 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-900/50 text-slate-800 dark:text-slate-200"><div class="flex items-center space-x-2 text-purple-700 dark:text-purple-400 font-semibold mb-1 text-sm uppercase tracking-wider"><i class="bi bi-stars"></i><span>Example</span></div><p class="text-sm leading-relaxed">${b.text}</p></div>`; },
            renderSummary(b) { return `<div class="my-6 p-6 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><div class="font-bold text-slate-900 dark:text-white mb-2 flex items-center space-x-2"><i class="bi bi-pin-angle"></i><span>Summary</span></div><p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${b.text}</p></div>`; },
            renderList(b) {
                const tag = b.ordered ? 'ol' : 'ul';
                const cls = b.ordered ? 'list-decimal list-inside my-4 space-y-2 text-slate-700 dark:text-slate-300' : 'list-disc list-inside my-4 space-y-2 text-slate-700 dark:text-slate-300';
                const items = (b.items || []).map(item => `<li class="leading-relaxed">${item}</li>`).join('');
                return `<${tag} class="${cls}">${items}</${tag}>`;
            },
            renderTable(b) {
                const headers = (b.headers || []).map(h => `<th class="px-4 py-3 text-left font-semibold text-xs text-slate-500 uppercase tracking-wider border-b border-slate-200 dark:border-slate-800">${h}</th>`).join('');
                const rows = (b.rows || []).map(row => `<tr class="hover:bg-slate-50 dark:hover:bg-slate-900/50">${row.map(cell => `<td class="px-4 py-3 text-sm text-slate-700 dark:text-slate-300 border-b border-slate-100 dark:border-slate-800/60">${cell}</td>`).join('')}</tr>`).join('');
                return `<div class="my-6 overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800"><table class="w-full text-left border-collapse bg-white dark:bg-slate-900"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
            },
            renderFormula(b) { return `<div class="my-6 p-5 rounded-2xl bg-slate-900 text-emerald-400 font-mono text-center text-lg overflow-x-auto shadow-inner border border-slate-800">${b.formula || b.text}</div>`; },
            renderQuote(b) { return `<blockquote class="my-6 pl-6 border-l-4 border-brand-500 italic text-slate-600 dark:text-slate-400 text-lg leading-relaxed">"${b.text}" ${b.author ? `<span class="block mt-2 text-sm font-normal not-italic text-slate-500">— ${b.author}</span>` : ''}</blockquote>`; },
            renderCode(b) { return `<div class="my-6 rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 text-slate-200 shadow-xl"><div class="px-4 py-2 bg-slate-900 border-b border-slate-800 text-xs font-mono text-slate-400 flex items-center justify-between"><span>${b.language || 'code'}</span></div><pre class="p-4 overflow-x-auto text-sm font-mono leading-relaxed"><code>${b.code || b.text}</code></pre></div>`; }
        };

        const SearchEngine = {
            handleInput(query) {
                clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(() => {
                    if (!query || query.trim().length < 2) {
                        if (Router.currentView === 'search') Router.navigate('dashboard');
                        return;
                    }
                    Router.navigate('search', { query: query.trim() });
                }, 300);
            },
            search(query) {
                const q = query.toLowerCase();
                const results = { lessons: [] };
                DataManager.getSubjects().forEach(sub => {
                    if (Array.isArray(sub.lessons)) {
                        sub.lessons.forEach(lesson => {
                            if (lesson.title.toLowerCase().includes(q) || (lesson.description && lesson.description.toLowerCase().includes(q))) {
                                results.lessons.push({ ...lesson, subjectName: sub.name });
                            }
                        });
                    }
                });
                return results;
            }
        };

        const FlashcardEngine = {
            currentIndex: 0,
            cards: [],
            isFlipped: false,
            init(cards) {
                this.cards = cards || [];
                this.currentIndex = 0;
                this.isFlipped = false;
            },
            flip() {
                this.isFlipped = !this.isFlipped;
                const cardEl = document.getElementById('flashcard-inner');
                if (cardEl) {
                    if (this.isFlipped) cardEl.classList.add('rotate-y-180');
                    else cardEl.classList.remove('rotate-y-180');
                }
            },
            next() {
                if (this.currentIndex < this.cards.length - 1) {
                    this.currentIndex++;
                    this.isFlipped = false;
                    Router.refreshCurrent();
                }
            },
            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.isFlipped = false;
                    Router.refreshCurrent();
                }
            },
            shuffle() {
                this.cards.sort(() => Math.random() - 0.5);
                this.currentIndex = 0;
                this.isFlipped = false;
                Router.refreshCurrent();
            }
        };

        const QuizEngine = {
            questions: [],
            currentIndex: 0,
            score: 0,
            isFinished: false,
            init(questions) {
                this.questions = [...(questions || [])].sort(() => Math.random() - 0.5);
                this.currentIndex = 0;
                this.score = 0;
                this.isFinished = false;
            },
            answer(answerValue) {
                const currentQ = this.questions[this.currentIndex];
                const isCorrect = String(answerValue).trim().toLowerCase() === String(currentQ.answer || currentQ.correctAnswer).trim().toLowerCase();
                if (isCorrect) this.score++;

                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    Router.refreshCurrent();
                } else {
                    this.isFinished = true;
                    ProgressManager.recordQuizResult({
                        score: this.score,
                        total: this.questions.length,
                        percentage: Math.round((this.score / this.questions.length) * 100)
                    });
                    Router.refreshCurrent();
                }
            }
        };

        const Router = {
            currentView: 'dashboard',
            params: {},
            navigate(view, params = {}) {
                this.currentView = view;
                this.params = params;
                this.render();
                window.scrollTo(0, 0);

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.getAttribute('data-nav') === view) {
                        btn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white');
                        btn.classList.remove('text-slate-600', 'dark:text-slate-400');
                    } else {
                        btn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white');
                        btn.classList.add('text-slate-600', 'dark:text-slate-400');
                    }
                });
            },
            refreshCurrent() { this.render(); },
            render() {
                const container = document.getElementById('view-container');
                if (!container) return;
                switch (this.currentView) {
                    case 'dashboard': container.innerHTML = this.renderDashboard(); break;
                    case 'subjects': container.innerHTML = this.renderSubjects(); break;
                    case 'subject-detail': container.innerHTML = this.renderSubjectDetail(this.params.id); break;
                    case 'lesson': container.innerHTML = this.renderLesson(this.params.id); break;
                    case 'flashcards': container.innerHTML = this.renderFlashcards(this.params.lessonId); break;
                    case 'quiz': container.innerHTML = this.renderQuiz(this.params.lessonId); break;
                    case 'bookmarks': container.innerHTML = this.renderBookmarks(); break;
                    case 'stats': container.innerHTML = this.renderStats(); break;
                    case 'settings': container.innerHTML = this.renderSettings(); break;
                    case 'search': container.innerHTML = this.renderSearch(this.params.query); break;
                    default: container.innerHTML = this.renderDashboard(); break;
                }
            },
            renderDashboard() {
                const subjects = DataManager.getSubjects();
                const totalLessons = subjects.reduce((acc, s) => acc + (s.lessons?.length || 0), 0);
                const progressState = ProgressManager.getState();
                const completedCount = Object.keys(progressState.completedLessons).length;
                const progressPercent = totalLessons > 0 ? Math.round((completedCount / totalLessons) * 100) : 0;

                return `
                    <div class="max-w-6xl mx-auto space-y-8 animate-fadeIn">

                            <div>
                                <span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold tracking-wide uppercase">Learning OS Engine Active</span>
                                <h2 class="text-3xl md:text-4xl font-bold mt-2 tracking-tight">Master Your Knowledge</h2>
                                <p class="text-emerald-100 mt-1 text-sm md:text-base max-w-xl">Dynamically rendering ${subjects.length} subjects and ${totalLessons} textbook lessons from active reviewer data.</p>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md border border-white/20 p-5 rounded-2xl flex items-center space-x-4 min-w-[220px]">
                                <div class="relative w-14 h-14 flex items-center justify-center font-bold text-lg">
                                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path class="text-white/20" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                        <path class="text-white" stroke-dasharray="${progressPercent}, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    </svg>
                                    <span class="absolute text-xs font-bold">${progressPercent}%</span>
                                </div>
                                <div>
                                    <div class="text-xs text-emerald-200 uppercase font-semibold">Total Progress</div>
                                    <div class="text-lg font-bold">${completedCount} / ${totalLessons} Lessons</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-6">
                                <h3 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Available Subjects</h3>
                                <button onclick="Router.navigate('subjects')" class="text-sm font-semibold text-brand-600 dark:text-brand-400 hover:underline">View All →</button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${subjects.map(sub => `
                                    <div onclick="Router.navigate('subject-detail', { id: '${sub.id}' })" class="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xs hover:shadow-xl hover:border-brand-500/50 transition-all cursor-pointer flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between mb-4">
                                                <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-2xl text-brand-600 dark:text-brand-400 group-hover:scale-110 transition-transform">${IconRenderer.render(sub.icon, 'bi-journal-text')}</div>
                                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${sub.lessons?.length || 0} Lessons</span>
                                            </div>
                                            <h4 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition-colors">${sub.name}</h4>
                                            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1 line-clamp-2">${sub.description || 'Comprehensive study modules.'}</p>
                                        </div>
                                        <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800 text-xs font-medium text-slate-500">
                                            <span>Difficulty: ${sub.difficulty || 'All Levels'}</span>
                                            <span class="text-brand-600 dark:text-brand-400 font-semibold group-hover:translate-x-1 transition-transform">Explore <i class="bi bi-arrow-right"></i></span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderSubjects() {
                const subjects = DataManager.getSubjects();
                return `
                    <div class="max-w-6xl mx-auto space-y-6">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">All Subjects & Curricula</h2>

                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                                    <div class="text-3xl mb-3 text-brand-600 dark:text-brand-400">${IconRenderer.render(sub.icon, 'bi-journal-text')}</div>
                                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">${sub.name}</h3>

                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                                <div class="text-4xl text-brand-600 dark:text-brand-400">${IconRenderer.render(subject.icon, 'bi-journal-text')}</div>

                                    <h2 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">${subject.name}</h2>

                                </div>
                            </div>

                                                        ${isCompleted ? '<span class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 rounded-md text-xs font-semibold">Completed</span>' : ''}
                                                    </div>
                                                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${lesson.description || ''}</p>
                                                </div>
                                            </div>
                                            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                                                ${Array.isArray(lesson.flashcards) && lesson.flashcards.length > 0 ? `<button onclick="Router.navigate('flashcards', { lessonId: '${lesson.id}' })" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium rounded-xl text-xs"><i class="bi bi-card-text mr-1"></i> Flashcards</button>` : ''}
                                                ${Array.isArray(lesson.questions) && lesson.questions.length > 0 ? `<button onclick="Router.navigate('quiz', { lessonId: '${lesson.id}' })" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium rounded-xl text-xs"><i class="bi bi-question-circle mr-1"></i> Quiz</button>` : ''}
                                                <button onclick="Router.navigate('lesson', { id: '${lesson.id}' })" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-xs shadow-md shadow-brand-500/20">Read Lesson</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderLesson(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson) return `<div class="p-8 text-center"><p>Lesson not found.</p><button onclick="Router.navigate('dashboard')" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Return Dashboard</button></div>`;
                const isBookmarked = ProgressManager.isBookmarked('lessons', lessonId);
                const isFavorite = ProgressManager.isFavorite('lessons', lessonId);
                const isCompleted = !!ProgressManager.getState().completedLessons[lessonId];

                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                            <button onclick="Router.navigate('subject-detail', { id: '${lesson.subjectId}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center space-x-1"><span><i class="bi bi-arrow-left"></i></span><span>Back to Subject</span></button>
                            <div class="flex items-center space-x-2">
                                <button onclick="ProgressManager.toggleBookmark('lessons', '${lessonId}')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm ${isBookmarked ? 'text-amber-500 font-bold' : 'text-slate-500'}" title="Bookmark"><i class="bi bi-bookmark${isBookmarked ? '-fill' : ''}"></i></button>
                                <button onclick="ProgressManager.toggleFavorite('lessons', '${lessonId}')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm ${isFavorite ? 'text-red-500 font-bold' : 'text-slate-500'}" title="Favorite"><i class="bi bi-heart${isFavorite ? '-fill' : ''}"></i></button>
                            </div>
                        </div>

                        <div>
                            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 dark:text-white tracking-tight">${lesson.title}</h1>
                            <p class="text-base text-slate-600 dark:text-slate-400 mt-2">${lesson.description || ''}</p>
                        </div>

                        <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 md:p-12 shadow-xs prose dark:prose-invert max-w-none">
                            ${ContentRenderer.render(lesson.content)}
                        </article>

                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <button onclick="ProgressManager.markLessonComplete('${lessonId}', ${!isCompleted}); Router.refreshCurrent();" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-colors ${isCompleted ? 'bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                                    ${isCompleted ? '<i class="bi bi-check-circle-fill mr-1"></i> Lesson Completed' : 'Mark as Completed'}
                                </button>
                            </div>
                            <div class="flex items-center space-x-3">
                                ${Array.isArray(lesson.flashcards) && lesson.flashcards.length > 0 ? `<button onclick="Router.navigate('flashcards', { lessonId: '${lesson.id}' })" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold rounded-xl text-sm">Study Flashcards</button>` : ''}
                                ${Array.isArray(lesson.questions) && lesson.questions.length > 0 ? `<button onclick="Router.navigate('quiz', { lessonId: '${lesson.id}' })" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-brand-500/20">Take Quiz</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderFlashcards(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson || !Array.isArray(lesson.flashcards) || lesson.flashcards.length === 0) {
                    return `<div class="p-8 text-center"><p>No flashcards available for this lesson.</p><button onclick="Router.navigate('dashboard')" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Return Dashboard</button></div>`;
                }
                if (FlashcardEngine.cards.length === 0 || FlashcardEngine.cards !== lesson.flashcards) {
                    FlashcardEngine.init(lesson.flashcards);
                }
                const currentCard = FlashcardEngine.cards[FlashcardEngine.currentIndex];

                return `
                    <div class="max-w-2xl mx-auto space-y-6 animate-fadeIn py-8">
                        <div class="flex items-center justify-between">
                            <button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400"><i class="bi bi-arrow-left"></i> Exit Flashcards</button>
                            <span class="text-sm font-bold text-slate-500">Card ${FlashcardEngine.currentIndex + 1} of ${FlashcardEngine.cards.length}</span>
                        </div>
                        <div onclick="FlashcardEngine.flip()" class="perspective-1000 w-full h-80 cursor-pointer">
                            <div id="flashcard-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-3xl ${FlashcardEngine.isFlipped ? 'rotate-y-180' : ''}">
                                <div class="absolute inset-0 w-full h-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 flex flex-col items-center justify-center text-center backface-hidden">
                                    <span class="text-xs font-bold uppercase tracking-wider text-brand-600 mb-4">Front (Question / Term)</span>

                                    <span class="text-xs text-slate-400 mt-6">(Click to flip)</span>
                                </div>
                                <div class="absolute inset-0 w-full h-full bg-slate-900 dark:bg-slate-800 text-white border border-slate-800 rounded-3xl p-8 flex flex-col items-center justify-center text-center backface-hidden rotate-y-180">
                                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-4">Back (Answer / Definition)</span>
                                    <p class="text-xl font-medium leading-relaxed">${currentCard.back}</p>
                                    <span class="text-xs text-slate-400 mt-6">(Click to flip back)</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-4">
                            <button onclick="FlashcardEngine.prev()" ${FlashcardEngine.currentIndex === 0 ? 'disabled' : ''} class="px-6 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl font-semibold text-sm disabled:opacity-40 shadow-xs">Previous</button>
                            <button onclick="FlashcardEngine.shuffle()" class="px-6 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl font-semibold text-sm shadow-xs">Shuffle</button>
                            <button onclick="FlashcardEngine.next()" ${FlashcardEngine.currentIndex === FlashcardEngine.cards.length - 1 ? 'disabled' : ''} class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-semibold text-sm disabled:opacity-40 shadow-md shadow-brand-500/20">Next</button>
                        </div>
                    </div>
                `;
            },
            renderQuiz(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson || !Array.isArray(lesson.questions) || lesson.questions.length === 0) {
                    return `<div class="p-8 text-center"><p>No quiz questions available for this lesson.</p><button onclick="Router.navigate('dashboard')" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Return Dashboard</button></div>`;

                if (QuizEngine.questions.length === 0 || QuizEngine.lessonId !== lessonId) {
                    QuizEngine.lessonId = lessonId;
                    QuizEngine.init(lesson.questions);
                }
                if (QuizEngine.isFinished) {
                    return `
                        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-xl my-12 animate-fadeIn">
                            <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-bold"><i class="bi bi-trophy"></i></div>

                            </div>

                }
                const currentQ = QuizEngine.questions[QuizEngine.currentIndex];
                return `
                    <div class="max-w-2xl mx-auto space-y-6 animate-fadeIn py-8">
                        <div class="flex items-center justify-between">
                            <button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400"><i class="bi bi-arrow-left"></i> Exit Quiz</button>
                            <span class="text-sm font-bold text-slate-500">Question ${QuizEngine.currentIndex + 1} of ${QuizEngine.questions.length}</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xs space-y-6">
                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-xs font-semibold uppercase tracking-wider">${currentQ.type || 'multiple_choice'}</span>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white leading-snug">${currentQ.question}</h3>
                            <div class="space-y-3">
                                ${(currentQ.options || currentQ.choices || ['True', 'False']).map(opt => `
                                    <button onclick="QuizEngine.answer('${opt}')" class="w-full text-left p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 hover:bg-brand-50/50 font-medium text-slate-800 dark:text-slate-200 transition-all text-sm">${opt}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderBookmarks() {
                const state = ProgressManager.getState();
                const bookmarkedLessons = Object.keys(state.bookmarks.lessons || {}).filter(id => state.bookmarks.lessons[id]).map(id => DataManager.getLesson(id)).filter(Boolean);
                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Bookmarks & Favorites</h2>
                            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Quickly access your saved lessons and subjects.</p>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Bookmarked Lessons (${bookmarkedLessons.length})</h3>
                            ${bookmarkedLessons.length === 0 ? '<p class="text-sm text-slate-500 italic">No bookmarked lessons yet.</p>' : `
                                <div class="space-y-3">
                                    ${bookmarkedLessons.map(lesson => `
                                        <div onclick="Router.navigate('lesson', { id: '${lesson.id}' })" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex items-center justify-between cursor-pointer hover:border-brand-500 transition-colors">
                                            <div>
                                                <h4 class="font-bold text-slate-900 dark:text-white">${lesson.title}</h4>
                                                <p class="text-xs text-slate-500 mt-0.5">${lesson.description || ''}</p>
                                            </div>
                                            <span class="text-brand-600 text-sm font-semibold">Read <i class="bi bi-arrow-right"></i></span>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                `;
            },
            renderStats() {
                const state = ProgressManager.getState();
                const totalLessons = DataManager.getSubjects().reduce((acc, s) => acc + (s.lessons?.length || 0), 0);
                const completedCount = Object.keys(state.completedLessons).length;
                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Study Statistics</h2>
                            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Review your learning streak, completed lessons, and quiz performance.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Lessons Completed</span>
                                <div class="text-3xl font-bold text-slate-900 dark:text-white mt-2">${completedCount} / ${totalLessons}</div>
                            </div>
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Current Streak</span>
                                <div class="text-3xl font-bold text-amber-500 mt-2">${state.streak} Days <i class="bi bi-fire"></i></div>
                            </div>
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Study Time</span>
                                <div class="text-3xl font-bold text-slate-900 dark:text-white mt-2">${state.studyTimeMinutes} mins</div>
                            </div>
                        </div>
                    </div>
                `;
            },
            renderSettings() {
                return `
                    <div class="max-w-2xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Settings</h2>
                            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Configure theme and data preferences.</p>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 space-y-6 shadow-xs">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white mb-2">Appearance</h3>
                                <div class="flex space-x-4">
                                    <button onclick="ThemeManager.apply('light')" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 font-semibold rounded-xl text-sm">Light Mode</button>
                                    <button onclick="ThemeManager.apply('dark')" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 font-semibold rounded-xl text-sm">Dark Mode</button>
                                </div>
                            </div>
                            <div class="pt-6 border-t border-slate-100 dark:border-slate-800">
                                <h3 class="font-bold text-slate-900 dark:text-white mb-2">Data Management</h3>
                                <button onclick="localStorage.clear(); location.reload();" class="px-5 py-2.5 bg-red-50 dark:bg-red-950/30 text-red-600 font-semibold rounded-xl text-sm border border-red-200 dark:border-red-900/50">Reset All Progress</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            renderSearch(query) {
                const results = SearchEngine.search(query);
                return `
                    <div class="max-w-4xl mx-auto space-y-6 animate-fadeIn">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Search Results for "${query}"</h2>
                        </div>
                        <div class="space-y-4">
                            ${results.lessons.map(lesson => `
                                <div onclick="Router.navigate('lesson', { id: '${lesson.id}' })" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 cursor-pointer hover:border-brand-500">
                                    <span class="text-xs font-semibold text-brand-600 uppercase tracking-wider">${lesson.subjectName}</span>
                                    <h4 class="text-lg font-bold text-slate-900 dark:text-white mt-1">${lesson.title}</h4>
                                    <p class="text-sm text-slate-500 mt-1">${lesson.description || ''}</p>
                                </div>
                            `).join('')}
                            ${results.lessons.length === 0 ? '<p class="text-slate-500 italic">No matching lessons found.</p>' : ''}
                        </div>
                    </div>
                `;
            }
        };

        const App = {
            init() {
                ThemeManager.init();
                const isValid = DataManager.init();
                if (!isValid) {
                    document.getElementById('error-screen').classList.remove('hidden');
                    return;
                }
                document.getElementById('app-shell').classList.remove('hidden');
                this.renderSidebarSubjects();
                Router.navigate('dashboard');
            },
            toggleMobileSidebar() {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
                document.getElementById('sidebar-backdrop').classList.toggle('hidden');
            },
            renderSidebarSubjects() {
                const container = document.getElementById('sidebar-subject-list');
                if (!container) return;
                container.innerHTML = DataManager.getSubjects().map(sub => `
                    <button onclick="Router.navigate('subject-detail', { id: '${sub.id}' })" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-left truncate">
                        <span class="text-base text-brand-600 dark:text-brand-400">${IconRenderer.render(sub.icon, 'bi-journal-text')}</span>
                        <span class="truncate">${sub.name}</span>
                    </button>
                `).join('');
            },
            showToast(message) {
                document.getElementById('modal-title').innerText = 'Notice';
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-container').classList.remove('hidden');
            },
            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        };

        window.addEventListener('DOMContentLoaded', () => { App.init(); });
    </script>
</body>
</html>
