<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning OS v2.5 - Educational Reviewer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Utility Styles -->
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 antialiased overflow-hidden flex flex-col">

    <!-- Mandatory Reviewer Data script -->
    <script src="reviewerData.js"></script>

    <!-- App Root Container -->
    <div id="app-root" class="h-full flex flex-col w-full"></div>

    <!-- Main JavaScript Application Engine -->
    <script>
        const StorageManager = {
            get(key, fallback) {
                try {
                    const item = localStorage.getItem('learning_os_' + key);
                    return item ? JSON.parse(item) : fallback;
                } catch (e) {
                    console.error('Storage read error for key:', key, e);
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem('learning_os_' + key, JSON.stringify(value));
                } catch (e) {
                    console.error('Storage write error for key:', key, e);
                }
            }
        };

        const ThemeManager = {
            init() {
                const saved = StorageManager.get('theme', 'system');
                this.apply(saved);
            },
            apply(theme) {
                const root = document.documentElement;
                const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
                StorageManager.set('theme', theme);
            }
        };

        const IconRenderer = {
            render(iconName, defaultIcon = 'bi-book') {
                if (!iconName) return `<i class="bi ${defaultIcon}"></i>`;
                const cleaned = String(iconName).trim();
                if (cleaned.startsWith('bi-') || cleaned.startsWith('fa-')) {
                    const prefix = cleaned.startsWith('fa-') ? 'fa fa-' : 'bi ';
                    return `<i class="${cleaned.includes('bi-') || cleaned.startsWith('bi-') ? 'bi ' + cleaned : cleaned}"></i>`;
                }
                if (cleaned.length <= 4 && !cleaned.includes(' ')) {
                    return `<span class="text-lg leading-none">${cleaned}</span>`;
                }
                return `<i class="bi ${cleaned}"></i>`;
            }
        };

        const ProgressManager = {
            getStats() {
                return StorageManager.get('stats', {
                    lessonsCompleted: [],
                    quizzesTaken: 0,
                    totalScore: 0,
                    flashcardsReviewed: 0,
                    studyTimeMinutes: 15,
                    streak: 3
                });
            },
            recordQuizResult(result) {
                const stats = this.getStats();
                stats.quizzesTaken++;
                stats.totalScore += result.percentage;
                StorageManager.set('stats', stats);
            },
            toggleLessonComplete(lessonId) {
                const stats = this.getStats();
                const index = stats.lessonsCompleted.indexOf(lessonId);
                if (index > -1) {
                    stats.lessonsCompleted.splice(index, 1);
                } else {
                    stats.lessonsCompleted.push(lessonId);
                }
                StorageManager.set('stats', stats);
            },
            isLessonComplete(lessonId) {
                return this.getStats().lessonsCompleted.includes(lessonId);
            }
        };

        const BookmarkManager = {
            getBookmarks() {
                return StorageManager.get('bookmarks', { subjects: [], lessons: [], flashcards: [] });
            },
            toggle(type, id) {
                const b = this.getBookmarks();
                const list = b[type] || [];
                const idx = list.indexOf(id);
                if (idx > -1) {
                    list.splice(idx, 1);
                } else {
                    list.push(id);
                }
                b[type] = list;
                StorageManager.set('bookmarks', b);
            },
            isBookmarked(type, id) {
                const b = this.getBookmarks();
                return (b[type] || []).includes(id);
            }
        };

        const DataManager = {
            validate() {
                if (typeof window.reviewerData === 'undefined' || !window.reviewerData) return { valid: false, error: 'reviewerData.js is missing or not loaded.' };
                if (!window.reviewerData.subjects || !Array.isArray(window.reviewerData.subjects)) return { valid: false, error: 'reviewerData.subjects is missing or not an Array.' };
                return { valid: true };
            },
            getSubjects() {
                const val = this.validate();
                if (!val.valid) return [];
                return window.reviewerData.subjects;
            },
            getSubject(subjectId) {
                return this.getSubjects().find(s => s.id === subjectId || s.name === subjectId);
            },
            getLesson(lessonId) {
                for (const sub of this.getSubjects()) {
                    if (sub.lessons && Array.isArray(sub.lessons)) {
                        const l = sub.lessons.find(item => item.id === lessonId || item.title === lessonId);
                        if (l) return { ...l, subject: sub };
                    }
                }
                return null;
            }
        };

        const ContentRenderer = {
            renderBlock(block) {
                if (!block || !block.type) return '';
                switch (block.type) {
                    case 'heading': return this.renderHeading(block);
                    case 'paragraph': return this.renderParagraph(block);
                    case 'definition': return this.renderDefinition(block);
                    case 'note': return this.renderNote(block);
                    case 'warning': return this.renderWarning(block);
                    case 'tip': return this.renderTip(block);
                    case 'example': return this.renderExample(block);
                    case 'summary': return this.renderSummary(block);
                    case 'list': return this.renderList(block);
                    case 'table': return this.renderTable(block);
                    case 'formula': return this.renderFormula(block);
                    case 'quote': return this.renderQuote(block);
                    case 'code': return this.renderCode(block);
                    default:
                        console.warn('Unknown content block type:', block.type);
                        return '';
                }
            },
            renderHeading(b) {
                const level = b.level || 2;
                const sizeClass = level === 1 ? 'text-3xl font-extrabold mt-8 mb-4' : level === 2 ? 'text-2xl font-bold mt-6 mb-3' : 'text-xl font-semibold mt-5 mb-2';
                return `<h${level} class="${sizeClass} text-slate-900 dark:text-white">${b.text || ''}</h${level}>`;
            },
            renderParagraph(b) {
                return `<p class="mb-4 leading-relaxed text-slate-700 dark:text-slate-300">${b.text || ''}</p>`;
            },
            renderDefinition(b) {
                return `
                    <div class="my-6 p-5 rounded-2xl bg-brand-50/60 dark:bg-brand-950/20 border border-brand-200 dark:border-brand-900/50 shadow-xs">
                        <div class="flex items-center space-x-2 text-brand-700 dark:text-brand-400 font-bold mb-2">
                            <i class="bi bi-journal-bookmark-fill"></i>
                            <span>Definition: ${b.term || ''}</span>
                        </div>
                        <p class="text-slate-700 dark:text-slate-300 text-sm leading-relaxed">${b.definition || b.text || ''}</p>
                    </div>
                `;
            },
            renderNote(b) {
                return `
                    <div class="my-6 p-5 rounded-2xl bg-blue-50/80 dark:bg-blue-950/20 border border-blue-200 dark:border-blue-900/50 text-blue-900 dark:text-blue-200">
                        <div class="flex items-center space-x-2 font-semibold mb-1"><i class="bi bi-info-circle-fill"></i><span>Note</span></div>
                        <p class="text-sm leading-relaxed">${b.text || ''}</p>
                    </div>
                `;
            },
            renderWarning(b) {
                return `
                    <div class="my-6 p-5 rounded-2xl bg-amber-50/80 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/50 text-amber-900 dark:text-amber-200">
                        <div class="flex items-center space-x-2 font-semibold mb-1"><i class="bi bi-exclamation-triangle-fill"></i><span>Warning</span></div>
                        <p class="text-sm leading-relaxed">${b.text || ''}</p>
                    </div>
                `;
            },
            renderTip(b) {
                return `
                    <div class="my-6 p-5 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-900/50 text-emerald-900 dark:text-emerald-200">
                        <div class="flex items-center space-x-2 font-semibold mb-1"><i class="bi bi-lightbulb-fill"></i><span>Tip</span></div>
                        <p class="text-sm leading-relaxed">${b.text || ''}</p>
                    </div>
                `;
            },
            renderExample(b) {
                return `
                    <div class="my-6 p-5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                        <div class="font-semibold text-slate-800 dark:text-slate-200 mb-2 flex items-center space-x-2"><i class="bi bi-code-square"></i><span>Example</span></div>
                        <p class="text-sm text-slate-700 dark:text-slate-300">${b.text || ''}</p>
                    </div>
                `;
            },
            renderSummary(b) {
                return `
                    <div class="my-6 p-6 rounded-3xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-900/50">
                        <h4 class="font-bold text-indigo-900 dark:text-indigo-300 mb-2 flex items-center space-x-2"><i class="bi bi-stars"></i><span>Summary</span></h4>
                        <p class="text-sm text-indigo-950 dark:text-indigo-200 leading-relaxed">${b.text || ''}</p>
                    </div>
                `;
            },
            renderList(b) {
                const tag = b.ordered ? 'ol' : 'ul';
                const styleClass = b.ordered ? 'list-decimal' : 'list-disc';
                const items = (b.items || []).map(item => `<li class="mb-1">${item}</li>`).join('');
                return `<${tag} class="${styleClass} list-inside my-4 space-y-1 text-slate-700 dark:text-slate-300 text-sm">${items}</${tag}>`;
            },
            renderTable(b) {
                const headers = (b.headers || []).map(h => `<th class="px-4 py-2 text-left font-semibold border-b border-slate-200 dark:border-slate-800">${h}</th>`).join('');
                const rows = (b.rows || []).map(row => `<tr>${row.map(cell => `<td class="px-4 py-2 border-b border-slate-100 dark:border-slate-900 text-slate-600 dark:text-slate-400">${cell}</td>`).join('')}</tr>`).join('');
                return `
                    <div class="my-6 overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-2xl">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200"><tr>${headers}</tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            },
            renderFormula(b) {
                return `<div class="my-6 p-4 rounded-xl bg-slate-900 text-slate-100 font-mono text-center overflow-x-auto text-sm shadow-inner">${b.text || b.formula || ''}</div>`;
            },
            renderQuote(b) {
                return `<blockquote class="my-6 pl-4 border-l-4 border-brand-500 italic text-slate-600 dark:text-slate-400">${b.text || ''}</blockquote>`;
            },
            renderCode(b) {
                return `<pre class="my-6 p-4 rounded-2xl bg-slate-900 text-slate-200 overflow-x-auto text-xs font-mono"><code>${b.text || ''}</code></pre>`;
            }
        };

        const FlashcardEngine = {
            cards: [],
            currentIndex: 0,
            isFlipped: false,
            init(cards) {
                this.cards = cards || [];
                this.currentIndex = 0;
                this.isFlipped = false;
            },
            flip() {
                this.isFlipped = !this.isFlipped;
                Router.refreshCurrent();
            },
            next() {
                if (this.currentIndex < this.cards.length - 1) {
                    this.currentIndex++;
                    this.isFlipped = false;
                    Router.refreshCurrent();
                }
            },
            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.isFlipped = false;
                    Router.refreshCurrent();
                }
            }
        };

        const QuizEngine = {
            questions: [],
            currentIndex: 0,
            score: 0,
            isFinished: false,
            feedback: null,
            init(questions) {
                this.questions = [...(questions || [])].sort(() => Math.random() - 0.5);
                this.currentIndex = 0;
                this.score = 0;
                this.isFinished = false;
                this.feedback = null;
            },
            answer(answerValue) {
                if (this.feedback) return;
                const currentQ = this.questions[this.currentIndex];
                const expected = String(currentQ.answer || currentQ.correctAnswer || '').trim().toLowerCase();
                const selected = String(answerValue).trim().toLowerCase();
                const isCorrect = selected === expected;
                
                if (isCorrect) this.score++;
                this.feedback = { isCorrect, selected };
                Router.refreshCurrent();

                setTimeout(() => {
                    this.feedback = null;
                    if (this.currentIndex < this.questions.length - 1) {
                        this.currentIndex++;
                        Router.refreshCurrent();
                    } else {
                        this.isFinished = true;
                        ProgressManager.recordQuizResult({
                            score: this.score,
                            total: this.questions.length,
                            percentage: Math.round((this.score / this.questions.length) * 100)
                        });
                        Router.refreshCurrent();
                    }
                }, 1600);
            }
        };

        const Router = {
            currentRoute: 'dashboard',
            params: {},
            navigate(route, params = {}) {
                this.currentRoute = route;
                this.params = params;
                this.render();
            },
            refreshCurrent() {
                this.render();
            },
            render() {
                const root = document.getElementById('app-root');
                const validation = DataManager.validate();
                
                if (!validation.valid) {
                    root.innerHTML = `
                        <div class="h-full flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950">
                            <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center space-y-4 shadow-xl">
                                <div class="w-16 h-16 bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold"><i class="bi bi-exclamation-triangle"></i></div>
                                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Reviewer Data Missing</h2>
                                <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">${validation.error}</p>
                                <p class="text-xs text-slate-400">Please make sure <code class="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-brand-600">reviewerData.js</code> is present in the root folder.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                root.innerHTML = `
                    <div class="h-full flex flex-col md:flex-row overflow-hidden">
                        <!-- Sidebar Navigation -->
                        <aside class="w-full md:w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-20">
                            <div class="p-6 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                                <div class="flex items-center space-x-3 cursor-pointer" onclick="Router.navigate('dashboard')">
                                    <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold shadow-md shadow-brand-500/20"><i class="bi bi-mortarboard-fill text-lg"></i></div>
                                    <div>
                                        <h1 class="font-bold text-sm tracking-tight text-slate-900 dark:text-white">Learning OS</h1>
                                        <p class="text-xs text-slate-500">v2.5 Professional</p>
                                    </div>
                                </div>
                            </div>
                            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                                <button onclick="Router.navigate('dashboard')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all ${this.currentRoute === 'dashboard' ? 'bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></button>
                                <button onclick="Router.navigate('subjects')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all ${this.currentRoute === 'subjects' || this.currentRoute === 'subject-detail' ? 'bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}"><i class="bi bi-book-fill"></i><span>Subjects</span></button>
                                <button onclick="Router.navigate('stats')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all ${this.currentRoute === 'stats' ? 'bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}"><i class="bi bi-graph-up-arrow"></i><span>Statistics</span></button>
                                <button onclick="Router.navigate('settings')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all ${this.currentRoute === 'settings' ? 'bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}"><i class="bi bi-gear-fill"></i><span>Settings</span></button>
                            </nav>
                        </aside>

                        <!-- Main Content Viewport -->
                        <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-950">
                            <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 flex items-center justify-between z-10">
                                <div class="flex items-center space-x-4 flex-1 max-w-md">
                                    <div class="relative w-full">
                                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="bi bi-search"></i></span>
                                        <input type="text" id="global-search" placeholder="Search subjects, lessons..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800/60 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-200" oninput="SearchEngine.handleInput(this.value)">
                                    </div>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <button onclick="ThemeManager.apply(document.documentElement.classList.contains('dark') ? 'light' : 'dark')" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"><i class="bi bi-sun-fill dark:hidden"></i><i class="bi bi-moon-fill hidden dark:block"></i></button>
                                </div>
                            </header>
                            <div class="flex-1 overflow-y-auto p-6 md:p-10" id="main-view-container">
                                ${this.getRouteView()}
                            </div>
                        </main>
                    </div>
                `;
            },
            getRouteView() {
                switch (this.currentRoute) {
                    case 'dashboard': return Views.renderDashboard();
                    case 'subjects': return Views.renderSubjects();
                    case 'subject-detail': return Views.renderSubjectDetail(this.params.id);
                    case 'lesson': return Views.renderLesson(this.params.id);
                    case 'flashcards': return Views.renderFlashcards(this.params.id);
                    case 'quiz': return Views.renderQuiz(this.params.id);
                    case 'stats': return Views.renderStats();
                    case 'settings': return Views.renderSettings();
                    default: return Views.renderDashboard();
                }
            }
        };

        const Views = {
            renderDashboard() {
                const subjects = DataManager.getSubjects();
                const stats = ProgressManager.getStats();
                return `
                    <div class="max-w-6xl mx-auto space-y-8 animate-fadeIn">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Welcome back!</h2>
                                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Continue your educational journey and master your subjects.</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center space-x-2 text-sm font-semibold shadow-xs">
                                    <i class="bi bi-fire text-amber-500"></i><span>${stats.streak} Day Streak</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950/50 text-brand-600 flex items-center justify-center font-bold"><i class="bi bi-book-fill"></i></div>
                                <div class="text-2xl font-bold text-slate-900 dark:text-white">${subjects.length}</div>
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Total Subjects</div>
                            </div>
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 flex items-center justify-center font-bold"><i class="bi bi-check-circle-fill"></i></div>
                                <div class="text-2xl font-bold text-slate-900 dark:text-white">${stats.lessonsCompleted.length}</div>
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Completed Lessons</div>
                            </div>
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 flex items-center justify-center font-bold"><i class="bi bi-patch-question-fill"></i></div>
                                <div class="text-2xl font-bold text-slate-900 dark:text-white">${stats.quizzesTaken}</div>
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Quizzes Taken</div>
                            </div>
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 flex items-center justify-center font-bold"><i class="bi bi-trophy-fill"></i></div>
                                <div class="text-2xl font-bold text-slate-900 dark:text-white">${stats.quizzesTaken ? Math.round(stats.totalScore / stats.quizzesTaken) : 0}%</div>
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Average Score</div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-xl font-bold text-slate-900 dark:text-white">Available Subjects</h3>
                                <button onclick="Router.navigate('subjects')" class="text-sm font-semibold text-brand-600 dark:text-brand-400 hover:underline">View All</button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${subjects.slice(0, 6).map(sub => `
                                    <div onclick="Router.navigate('subject-detail', { id: '${sub.id || sub.name}' })" class="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs hover:shadow-xl hover:border-brand-500 transition-all cursor-pointer flex flex-col justify-between space-y-4">
                                        <div class="flex items-start justify-between">
                                            <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xl font-bold transition-transform group-hover:scale-110">
                                                ${IconRenderer.render(sub.icon, 'bi-book')}
                                            </div>
                                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-xs font-semibold">${(sub.lessons || []).length} Lessons</span>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-lg text-slate-900 dark:text-white group-hover:text-brand-600 transition-colors">${sub.name}</h4>
                                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${sub.description || 'Explore comprehensive lessons and quizzes.'}</p>
                                        </div>
                                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs font-semibold text-brand-600 dark:text-brand-400">
                                            <span>Explore Subject</span>
                                            <i class="bi bi-arrow-right transition-transform group-hover:translate-x-1"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderSubjects() {
                const subjects = DataManager.getSubjects();
                return `
                    <div class="max-w-6xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">All Subjects</h2>
                            <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Select a subject to dive into lessons, flashcards, and quizzes.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${subjects.map(sub => `
                                <div onclick="Router.navigate('subject-detail', { id: '${sub.id || sub.name}' })" class="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs hover:shadow-xl hover:border-brand-500 transition-all cursor-pointer flex flex-col justify-between space-y-4">
                                    <div class="flex items-start justify-between">
                                        <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xl font-bold transition-transform group-hover:scale-110">
                                            ${IconRenderer.render(sub.icon, 'bi-book')}
                                        </div>
                                        <span class="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-xs font-semibold">${(sub.lessons || []).length} Lessons</span>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-lg text-slate-900 dark:text-white group-hover:text-brand-600 transition-colors">${sub.name}</h3>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${sub.description || ''}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },
            renderSubjectDetail(subjectId) {
                const subject = DataManager.getSubject(subjectId);
                if (!subject) return `<div class="p-8 text-center"><p>Subject not found.</p><button onclick="Router.navigate('subjects')" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-xl text-sm">Back to Subjects</button></div>`;
                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <button onclick="Router.navigate('subjects')" class="text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center space-x-2"><i class="bi bi-arrow-left"></i><span>Back to Subjects</span></button>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xs space-y-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-2xl bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 flex items-center justify-center text-3xl font-bold">${IconRenderer.render(subject.icon, 'bi-book')}</div>
                                <div>
                                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${subject.name}</h2>
                                    <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">${subject.description || ''}</p>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white">Lessons (${(subject.lessons || []).length})</h3>
                            <div class="space-y-3">
                                ${(subject.lessons || []).map((lesson, idx) => `
                                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2 text-xs font-semibold text-brand-600 dark:text-brand-400 uppercase tracking-wider">Lesson ${idx + 1}</div>
                                            <h4 class="font-bold text-base text-slate-900 dark:text-white">${lesson.title}</h4>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <button onclick="Router.navigate('lesson', { id: '${lesson.id || lesson.title}' })" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-brand-500/20">Read</button>
                                            ${Array.isArray(lesson.flashcards) && lesson.flashcards.length > 0 ? `<button onclick="Router.navigate('flashcards', { id: '${lesson.id || lesson.title}' })" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold">Flashcards</button>` : ''}
                                            ${Array.isArray(lesson.questions) && lesson.questions.length > 0 ? `<button onclick="Router.navigate('quiz', { id: '${lesson.id || lesson.title}' })" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold">Quiz</button>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderLesson(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson) return `<div class="p-8 text-center"><p>Lesson not found.</p><button onclick="Router.navigate('dashboard')" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-xl text-sm">Dashboard</button></div>`;
                const isComplete = ProgressManager.isLessonComplete(lessonId);
                let contentHtml = '';
                if (Array.isArray(lesson.content)) {
                    contentHtml = lesson.content.map(block => ContentRenderer.renderBlock(block)).join('');
                } else if (typeof lesson.content === 'string') {
                    contentHtml = `<p class="leading-relaxed text-slate-700 dark:text-slate-300">${lesson.content}</p>`;
                } else {
                    contentHtml = `<p class="text-slate-500">No content available for this lesson.</p>`;
                }
                return `
                    <div class="max-w-3xl mx-auto space-y-8 animate-fadeIn pb-16">
                        <div class="flex items-center justify-between">
                            <button onclick="Router.navigate('subject-detail', { id: '${lesson.subject.id || lesson.subject.name}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 flex items-center space-x-2"><i class="bi bi-arrow-left"></i><span>Back to ${lesson.subject.name}</span></button>
                            <button onclick="ProgressManager.toggleLessonComplete('${lessonId}'); Router.refreshCurrent();" class="px-4 py-2 rounded-xl text-xs font-semibold flex items-center space-x-2 ${isComplete ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'}"><i class="bi ${isComplete ? 'bi-check-circle-fill' : 'bi-circle'}"></i><span>${isComplete ? 'Completed' : 'Mark as Complete'}</span></button>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 md:p-12 shadow-xs space-y-6">
                            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white leading-tight">${lesson.title}</h1>
                            <div class="pt-6 border-t border-slate-100 dark:border-slate-800 prose dark:prose-invert max-w-none">
                                ${contentHtml}
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-4">
                            ${Array.isArray(lesson.flashcards) && lesson.flashcards.length > 0 ? `<button onclick="Router.navigate('flashcards', { id: '${lessonId}' })" class="px-6 py-3 bg-brand-600 text-white rounded-2xl text-sm font-semibold shadow-md shadow-brand-500/20">Study Flashcards</button>` : '<div></div>'}
                            ${Array.isArray(lesson.questions) && lesson.questions.length > 0 ? `<button onclick="Router.navigate('quiz', { id: '${lessonId}' })" class="px-6 py-3 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-2xl text-sm font-semibold">Take Quiz</button>` : ''}
                        </div>
                    </div>
                `;
            },
            renderFlashcards(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson || !Array.isArray(lesson.flashcards) || lesson.flashcards.length === 0) {
                    return `<div class="p-8 text-center"><p>No flashcards available.</p><button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-xl text-sm">Return Lesson</button></div>`;
                }
                if (FlashcardEngine.cards.length === 0) {
                    FlashcardEngine.init(lesson.flashcards);
                }
                const card = FlashcardEngine.cards[FlashcardEngine.currentIndex];
                return `
                    <div class="max-w-xl mx-auto space-y-6 animate-fadeIn py-8">
                        <div class="flex items-center justify-between">
                            <button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400"><i class="bi bi-arrow-left"></i> Exit Flashcards</button>
                            <span class="text-sm font-bold text-slate-500">Card ${FlashcardEngine.currentIndex + 1} of ${FlashcardEngine.cards.length}</span>
                        </div>
                        <div onclick="FlashcardEngine.flip()" class="min-h-[300px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-lg flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:border-brand-500">
                            <span class="text-xs uppercase font-semibold text-brand-600 dark:text-brand-400 mb-4">${FlashcardEngine.isFlipped ? 'Answer' : 'Question (Click to flip)'}</span>
                            <h3 class="text-2xl font-bold text-slate-900 dark:text-white">${FlashcardEngine.isFlipped ? (card.answer || card.back) : (card.question || card.front)}</h3>
                        </div>
                        <div class="flex justify-between items-center">
                            <button onclick="FlashcardEngine.prev()" ${FlashcardEngine.currentIndex === 0 ? 'disabled' : ''} class="px-6 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold disabled:opacity-40">Previous</button>
                            <button onclick="FlashcardEngine.next()" ${FlashcardEngine.currentIndex === FlashcardEngine.cards.length - 1 ? 'disabled' : ''} class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl text-sm font-semibold shadow-md shadow-brand-500/20 disabled:opacity-40">Next</button>
                        </div>
                    </div>
                `;
            },
            renderQuiz(lessonId) {
                const lesson = DataManager.getLesson(lessonId);
                if (!lesson || !Array.isArray(lesson.questions) || lesson.questions.length === 0) {
                    return `<div class="p-8 text-center"><p>No quiz questions available.</p><button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-xl text-sm">Return Lesson</button></div>`;
                }
                if (QuizEngine.questions.length === 0) {
                    QuizEngine.init(lesson.questions);
                }
                if (QuizEngine.isFinished) {
                    return `
                        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-xl my-12 animate-fadeIn">
                            <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-bold"><i class="bi bi-trophy"></i></div>
                            <h2 class="text-3xl font-bold text-slate-900 dark:text-white">Quiz Completed!</h2>
                            <p class="text-slate-600 dark:text-slate-400">You scored <span class="font-bold text-slate-900 dark:text-white text-xl">${QuizEngine.score}</span> out of <span class="font-bold text-slate-900 dark:text-white text-xl">${QuizEngine.questions.length}</span></p>
                            <div class="flex justify-center space-x-4 pt-4">
                                <button onclick="QuizEngine.init(DataManager.getLesson('${lessonId}').questions); Router.refreshCurrent();" class="px-6 py-3 bg-slate-100 dark:bg-slate-800 font-semibold rounded-2xl text-sm">Try Again</button>
                                <button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="px-6 py-3 bg-brand-600 text-white font-semibold rounded-2xl text-sm shadow-md shadow-brand-500/20">Return Lesson</button>
                            </div>
                        </div>
                    `;
                }
                const currentQ = QuizEngine.questions[QuizEngine.currentIndex];
                const feedbackHtml = QuizEngine.feedback ? `
                    <div class="p-4 rounded-2xl ${QuizEngine.feedback.isCorrect ? 'bg-emerald-100 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800' : 'bg-red-100 dark:bg-red-950/40 text-red-800 dark:text-red-300 border border-red-300 dark:border-red-800'} flex items-center space-x-3 animate-fadeIn">
                        <i class="bi ${QuizEngine.feedback.isCorrect ? 'bi-check-circle-fill text-emerald-600 text-xl' : 'bi-x-circle-fill text-red-600 text-xl'}"></i>
                        <div>
                            <div class="font-bold text-sm">${QuizEngine.feedback.isCorrect ? 'Correct!' : 'Incorrect!'}</div>
                            <div class="text-xs opacity-90">${QuizEngine.feedback.isCorrect ? 'Great job on getting this right.' : `The correct answer was: <strong>${currentQ.answer || currentQ.correctAnswer}</strong>`}</div>
                        </div>
                    </div>
                ` : '';

                return `
                    <div class="max-w-2xl mx-auto space-y-6 animate-fadeIn py-8">
                        <div class="flex items-center justify-between">
                            <button onclick="Router.navigate('lesson', { id: '${lessonId}' })" class="text-sm font-semibold text-slate-600 dark:text-slate-400"><i class="bi bi-arrow-left"></i> Exit Quiz</button>
                            <span class="text-sm font-bold text-slate-500">Question ${QuizEngine.currentIndex + 1} of ${QuizEngine.questions.length}</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xs space-y-6">
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white leading-snug">${currentQ.question}</h3>
                            ${feedbackHtml}
                            <div class="space-y-3">
                                ${(currentQ.options || currentQ.choices || ['True', 'False']).map(opt => `
                                    <button onclick="QuizEngine.answer('${opt.replace(/'/g, "\\'")}')" ${QuizEngine.feedback ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 font-medium text-slate-800 dark:text-slate-200 transition-all text-sm disabled:opacity-80">${opt}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },
            renderStats() {
                const stats = ProgressManager.getStats();
                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Study Statistics</h2>
                            <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Review your overall learning metrics and consistency.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Lessons Completed</div>
                                <div class="text-3xl font-bold text-slate-900 dark:text-white">${stats.lessonsCompleted.length}</div>
                            </div>
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Quizzes Taken</div>
                                <div class="text-3xl font-bold text-slate-900 dark:text-white">${stats.quizzesTaken}</div>
                            </div>
                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs space-y-2">
                                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Average Score</div>
                                <div class="text-3xl font-bold text-slate-900 dark:text-white">${stats.quizzesTaken ? Math.round(stats.totalScore / stats.quizzesTaken) : 0}%</div>
                            </div>
                        </div>
                    </div>
                `;
            },
            renderSettings() {
                return `
                    <div class="max-w-2xl mx-auto space-y-8 animate-fadeIn">
                        <div>
                            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Settings</h2>
                            <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Configure your learning OS preferences.</p>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xs space-y-6">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white mb-2">Theme Mode</h3>
                                <div class="flex space-x-3">
                                    <button onclick="ThemeManager.apply('light')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">Light</button>
                                    <button onclick="ThemeManager.apply('dark')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">Dark</button>
                                    <button onclick="ThemeManager.apply('system')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">System</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        const SearchEngine = {
            handleInput(query) {
                // Real-time search placeholder logic
            }
        };

        // Initialize application on window load
        window.addEventListener('DOMContentLoaded', () => {
            ThemeManager.init();
            Router.navigate('dashboard');
        });
    </script>
</body>
</html>
