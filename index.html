    <!-- Global Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-start justify-center pt-20 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center space-x-3">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                <input id="global-search-input" type="text" placeholder="Type to search subjects, lessons, flashcards, questions..." class="flex-1 bg-transparent border-none outline-none text-slate-900 dark:text-white placeholder-slate-400 text-base">
                <button id="search-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm px-2 py-1 rounded bg-slate-100 dark:bg-slate-700">ESC</button>

                    <p class="text-sm">Start typing to search across all educational content.</p>

    <script>
        class StorageManager {
            static get(key, defaultValue) {
                try {
                    const item = localStorage.getItem(`learning_os_${key}`);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    console.error("Storage read error:", e);
                    return defaultValue;
                }
            }

            static set(key, value) {
                try {
                    localStorage.setItem(`learning_os_${key}`, JSON.stringify(value));
                } catch (e) {
                    console.error("Storage write error:", e);
                }
            }
        }

        class ThemeManager {
            static init() {
                const savedTheme = StorageManager.get('theme', 'system');
                this.apply(savedTheme);
            }

            static apply(theme) {
                const root = document.documentElement;
                if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
                StorageManager.set('theme', theme);
            }

            static toggle() {
                const isDark = document.documentElement.classList.contains('dark');
                this.apply(isDark ? 'light' : 'dark');
            }
        }

        class ProgressManager {
            static getProgress() {
                return StorageManager.get('progress', {
                    completedLessons: {}, // lessonId: true
                    lessonProgress: {}, // lessonId: percentage
                    quizHistory: [], // {quizId, score, total, date, type}
                    flashcardProgress: {}, // cardId: status
                    streak: { count: 0, lastDate: null },
                    studyTimeMinutes: 0
                });
            }

            static saveProgress(progress) {
                StorageManager.set('progress', progress);
            }

            static markLessonComplete(lessonId, completed = true) {
                const progress = this.getProgress();
                progress.completedLessons[lessonId] = completed;
                this.checkAndUpdateStreak();
                this.saveProgress(progress);
            }

            static recordQuizResult(result) {
                const progress = this.getProgress();
                progress.quizHistory.push({ ...result, date: new Date().toISOString() });
                this.checkAndUpdateStreak();
                this.saveProgress(progress);
            }

            static checkAndUpdateStreak() {
                const progress = this.getProgress();
                const today = new Date().toDateString();
                if (progress.streak.lastDate === today) return;

                const last = progress.streak.lastDate ? new Date(progress.streak.lastDate) : null;
                const now = new Date(today);

                if (!last) {
                    progress.streak.count = 1;
                } else {
                    const diffTime = Math.abs(now - last);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) {
                        progress.streak.count += 1;
                    } else if (diffDays > 1) {
                        progress.streak.count = 1;
                    }
                }
                progress.streak.lastDate = today;
                this.saveProgress(progress);
            }
        }

        class BookmarksManager {
            static getBookmarks() {
                return StorageManager.get('bookmarks', { subjects: {}, lessons: {}, flashcards: {}, questions: {} });
            }

            static getFavorites() {
                return StorageManager.get('favorites', { subjects: {}, lessons: {}, flashcards: {}, questions: {} });
            }

            static toggleBookmark(type, id) {
                const bm = this.getBookmarks();
                bm[type][id] = !bm[type][id];
                StorageManager.set('bookmarks', bm);
                return bm[type][id];
            }

            static toggleFavorite(type, id) {
                const fav = this.getFavorites();
                fav[type][id] = !fav[type][id];
                StorageManager.set('favorites', fav);
                return fav[type][id];
            }

            static isBookmarked(type, id) {
                return !!this.getBookmarks()[type][id];
            }

            static isFavorite(type, id) {
                return !!this.getFavorites()[type][id];
            }
        }

        class DataManager {
            static validateAndInit() {
                if (typeof window.reviewerData === 'undefined' || !window.reviewerData || !Array.isArray(window.reviewerData.subjects)) {
                    document.getElementById('error-screen').classList.remove('hidden');
                    return false;
                }
                return true;
            }

            static getSubjects() {
                return window.reviewerData.subjects || [];
            }

            static getSubject(subjectId) {
                return this.getSubjects().find(s => (s.id || s.name) === subjectId);
            }

            static getLesson(subjectId, lessonId) {
                const subject = this.getSubject(subjectId);
                if (!subject || !subject.lessons) return null;
                return subject.lessons.find(l => (l.id || l.title) === lessonId);
            }

            static getAllLessons() {
                let lessons = [];
                this.getSubjects().forEach(subj => {
                    if (subj.lessons) {
                        subj.lessons.forEach(lesson => {
                            lessons.push({ ...lesson, subjectId: subj.id || subj.name, subjectName: subj.name });
                        });
                    }
                });
                return lessons;
            }

            static getAllFlashcards() {
                let cards = [];
                this.getSubjects().forEach(subj => {
                    if (subj.lessons) {
                        subj.lessons.forEach(lesson => {
                            if (lesson.flashcards) {
                                lesson.flashcards.forEach((card, idx) => {
                                    cards.push({ ...card, id: card.id || `${subj.id}-${lesson.id || lesson.title}-fc-${idx}`, lessonTitle: lesson.title, subjectName: subj.name });
                                });
                            }
                        });
                    }
                });
                return cards;
            }

            static getAllQuestions() {
                let questions = [];
                this.getSubjects().forEach(subj => {
                    if (subj.lessons) {
                        subj.lessons.forEach(lesson => {
                            if (lesson.questions) {
                                lesson.questions.forEach((q, idx) => {
                                    questions.push({ ...q, id: q.id || `${subj.id}-${lesson.id || lesson.title}-q-${idx}`, lessonTitle: lesson.title, subjectName: subj.name });
                                });
                            }
                        });
                    }
                });
                return questions;
            }
        }

        class ContentParser {
            static parse(content) {
                if (!content) return '<p class="text-slate-400 italic">No content available for this lesson.</p>';
                
                // If content is array of paragraphs or strings
                if (Array.isArray(content)) {
                    content = content.join('\n\n');
                }

                if (typeof content !== 'string') {
                    content = String(content);
                }

                const lines = content.split('\n');
                let html = '';
                let inList = false;
                let listType = 'ul';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    // Headings
                    if (line.startsWith('# ')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white mt-8 mb-4">${this.escapeHtml(line.substring(2))}</h1>`;
                        continue;
                    }
                    if (line.startsWith('## ')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<h2 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mt-6 mb-3">${this.escapeHtml(line.substring(3))}</h2>`;
                        continue;
                    }
                    if (line.startsWith('### ')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<h3 class="text-lg md:text-xl font-semibold text-slate-800 dark:text-slate-200 mt-5 mb-2">${this.escapeHtml(line.substring(4))}</h3>`;
                        continue;
                    }

                    // Notes / Warnings / Definitions Callouts
                    if (line.startsWith('> NOTE:') || line.startsWith('>Note:')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<div class="my-4 p-4 rounded-xl bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500 text-blue-900 dark:text-blue-200 text-sm"><strong class="font-semibold"><i class="fa-solid fa-circle-info mr-2"></i>Note:</strong> ${this.escapeHtml(line.replace(/^> ?(NOTE:|Note:)/, '').trim())}</div>`;
                        continue;
                    }
                    if (line.startsWith('> WARNING:') || line.startsWith('>Warning:')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<div class="my-4 p-4 rounded-xl bg-amber-50 dark:bg-amber-900/20 border-l-4 border-amber-500 text-amber-900 dark:text-amber-200 text-sm"><strong class="font-semibold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Warning:</strong> ${this.escapeHtml(line.replace(/^> ?(WARNING:|Warning:)/, '').trim())}</div>`;
                        continue;
                    }
                    if (line.startsWith('> ')) {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        html += `<blockquote class="my-4 pl-4 border-l-4 border-brand-500 italic text-slate-700 dark:text-slate-300">${this.escapeHtml(line.substring(2))}</blockquote>`;
                        continue;
                    }

                    // Bullet lists
                    if (line.startsWith('- ') || line.startsWith('* ')) {
                        if (!inList || listType !== 'ul') {
                            if (inList) html += `</${listType}>`;
                            html += `<ul class="list-disc list-inside space-y-1.5 my-3 text-slate-700 dark:text-slate-300">`;
                            inList = true;
                            listType = 'ul';
                        }
                        html += `<li>${this.escapeHtml(line.substring(2))}</li>`;
                        continue;
                    }

                    // Numbered lists
                    if (/^\d+\.\s/.test(line)) {
                        if (!inList || listType !== 'ol') {
                            if (inList) html += `</${listType}>`;
                            html += `<ol class="list-decimal list-inside space-y-1.5 my-3 text-slate-700 dark:text-slate-300">`;
                            inList = true;
                            listType = 'ol';
                        }
                        html += `<li>${this.escapeHtml(line.replace(/^\d+\.\s/, ''))}</li>`;
                        continue;
                    }

                    // Empty lines
                    if (line === '') {
                        if (inList) { html += `</${listType}>`; inList = false; }
                        continue;
                    }

                    // Standard paragraph
                    if (inList) { html += `</${listType}>`; inList = false; }
                    html += `<p class="my-3 text-slate-700 dark:text-slate-300 leading-relaxed">${this.escapeHtml(line)}</p>`;
                }

                if (inList) html += `</${listType}>`;
                return html;
            }

            static escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        }

        class Router {
            static init() {
                window.addEventListener('hashchange', () => this.handleRoute());
                window.addEventListener('load', () => this.handleRoute());
            }

            static handleRoute() {
                const hash = window.location.hash || '#dashboard';
                const parts = hash.split('/');
                const route = parts[0];

                // Highlight active nav
                document.querySelectorAll('.nav-item').forEach(el => {
                    const r = el.getAttribute('data-route');
                    if (hash.includes(r)) {
                        el.classList.add('bg-brand-50', 'dark:bg-brand-900/30', 'text-brand-600', 'dark:text-brand-400');
                        el.classList.remove('text-slate-600', 'dark:text-slate-300');
                    } else {
                        el.classList.remove('bg-brand-50', 'dark:bg-brand-900/30', 'text-brand-600', 'dark:text-brand-400');
                        el.classList.add('text-slate-600', 'dark:text-slate-300');
                    }
                });

                const viewport = document.getElementById('main-viewport');

                if (hash === '#dashboard' || hash === '') {
                    Renderer.renderDashboard(viewport);
                } else if (hash === '#subjects') {
                    Renderer.renderSubjectsList(viewport);
                } else if (route === '#subject' && parts[1]) {
                    if (parts[2] === 'lesson' && parts[3]) {
                        Renderer.renderLessonReader(viewport, parts[1], parts[3]);
                    } else if (parts[2] === 'flashcards') {
                        Renderer.renderFlashcards(viewport, parts[1]);
                    } else if (parts[2] === 'quiz') {
                        Renderer.renderQuiz(viewport, parts[1]);
                    } else {
                        Renderer.renderSubjectDetail(viewport, parts[1]);
                    }
                } else if (hash === '#bookmarks') {
                    Renderer.renderBookmarks(viewport);
                } else if (hash === '#statistics') {
                    Renderer.renderStatistics(viewport);
                } else if (hash === '#settings') {
                    Renderer.renderSettings(viewport);
                } else {
                    Renderer.renderDashboard(viewport);
                }

                // Close mobile sidebar if open
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        class Renderer {
            static renderDashboard(container) {
                const subjects = DataManager.getSubjects();
                const progress = ProgressManager.getProgress();
                const bookmarks = BookmarksManager.getBookmarks();

                // Compute Stats
                const totalSubjects = subjects.length;
                let totalLessons = 0;
                let completedLessonsCount = Object.keys(progress.completedLessons).filter(k => progress.completedLessons[k]).length;
                subjects.forEach(s => { if(s.lessons) totalLessons += s.lessons.length; });

                let html = `
                    <div class="max-w-6xl mx-auto space-y-8 pb-12">
                        <!-- Welcome Hero Banner -->
                        <div class="bg-gradient-to-r from-brand-600 to-indigo-700 rounded-3xl p-6 md:p-10 text-white shadow-xl shadow-brand-500/10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div class="space-y-2">

            static flipFlashcard() {
                window._isFlipped = !window._isFlipped;
                const inner = document.getElementById('flashcard-inner');
                if (inner) {
                    if (window._isFlipped) {
                        inner.style.transform = 'rotateY(180deg)';
                    } else {
                        inner.style.transform = 'rotateY(0deg)';
                    }
                }
            }

            static nextFlashcard() {
                if (!window._currentFlashcards) return;
                window._flashcardIndex = (window._flashcardIndex + 1) % window._currentFlashcards.length;
                Renderer.updateFlashcardView();
            }

            static prevFlashcard() {
                if (!window._currentFlashcards) return;
                window._flashcardIndex = (window._flashcardIndex - 1 + window._currentFlashcards.length) % window._currentFlashcards.length;
                Renderer.updateFlashcardView();
            }

            static shuffleFlashcards() {
                if (!window._currentFlashcards) return;
                for (let i = window._currentFlashcards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [window._currentFlashcards[i], window._currentFlashcards[j]] = [window._currentFlashcards[j], window._currentFlashcards[i]];
                }
                window._flashcardIndex = 0;
                Renderer.updateFlashcardView();
            }

            static updateFlashcardView() {
                window._isFlipped = false;
                const inner = document.getElementById('flashcard-inner');
                if (inner) inner.style.transform = 'rotateY(0deg)';

                const card = window._currentFlashcards[window._flashcardIndex];
                document.getElementById('fc-front-text').textContent = card.front || card.question || '';
                document.getElementById('fc-back-text').textContent = card.back || card.answer || '';
                document.getElementById('fc-counter').textContent = `Card ${window._flashcardIndex + 1} of ${window._currentFlashcards.length}`;
            }

                            <div class="text-4xl font-extrabold text-brand-600 dark:text-brand-400">${percentage}%</div>
                            <p class="text-slate-600 dark:text-slate-300">You scored ${score} out of ${total} correct answers.</p>
                            <div class="flex items-center justify-center gap-4 pt-4">
                                <a href="#subject/${subjectId}" class="px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm hover:bg-slate-200 transition-colors">Back to Subject</a>
                                <button onclick="Renderer.renderQuiz(document.getElementById('main-viewport'), '${subjectId}')" class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition-colors shadow-md">Try Again</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                const q = questions[index];
                let choicesHtml = '';

                // Handle different question types gracefully (Multiple Choice, True/False, Identification, etc.)
                if (q.choices && Array.isArray(q.choices)) {
                    q.choices.forEach((choice, cIdx) => {
                        choicesHtml += `
                            <button onclick="Renderer.submitQuizAnswer(${index}, '${Renderer.escape(choice)}', '${Renderer.escape(q.answer || q.correct || '')}')" class="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 hover:bg-brand-50/50 dark:hover:bg-brand-900/10 font-medium text-slate-800 dark:text-slate-200 transition-all flex items-center justify-between group">
                                <span>${Renderer.escape(choice)}</span>
                                <div class="w-6 h-6 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center group-hover:border-brand-500 group-hover:text-brand-500 text-xs"></div>
                            </button>
                        `;
                    });
                } else {
                    // Open answer / Identification fallback
                    choicesHtml = `
                        <div class="space-y-3">
                            <input type="text" id="quiz-text-answer" placeholder="Type your answer here..." class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-brand-500">
                            <button onclick="Renderer.submitQuizTextAnswer(${index}, '${Renderer.escape(q.answer || q.correct || '')}')" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-colors">Submit Answer</button>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto space-y-6 pb-12">
                        <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
                            <a href="#subject/${subjectId}" class="hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Exit Quiz</a>
                            <span class="font-semibold">Question ${index + 1} of ${questions.length}</span>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm space-y-6">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">${Renderer.escape(q.question || q.prompt || '')}</h2>
                            <div class="space-y-3" id="quiz-choices-container">
                                ${choicesHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            static submitQuizAnswer(index, chosen, correct) {
                const isCorrect = chosen.trim().toLowerCase() === correct.trim().toLowerCase();
                if (isCorrect) window._quizScore++;

                window._quizIndex++;
                const hash = window.location.hash;
                const subjectId = hash.split('/')[1];
                Renderer.renderCurrentQuizQuestion(document.getElementById('main-viewport'), subjectId);
            }

            static submitQuizTextAnswer(index, correct) {
                const val = document.getElementById('quiz-text-answer').value;
                Renderer.submitQuizAnswer(index, val, correct);
            }

            static renderBookmarks(container) {
                const bookmarks = BookmarksManager.getBookmarks();
                const subjects = DataManager.getSubjects();

                let bookmarkedLessons = [];
                subjects.forEach(s => {
                    if (s.lessons) {
                        s.lessons.forEach(l => {
                            const lId = l.id || l.title;
                            if (bookmarks.lessons[lId]) {
                                bookmarkedLessons.push({ ...l, subjectId: s.id || s.name, subjectName: s.name });
                            }
                        });
                    }
                });

                let html = `
                    <div class="max-w-4xl mx-auto space-y-6 pb-12">
                        <div>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Bookmarks</h1>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">Quickly access your bookmarked lessons and study materials.</p>
                        </div>
                        <div class="space-y-3">
                `;

                if (bookmarkedLessons.length === 0) {
                    html += `<div class="bg-white dark:bg-slate-800 rounded-2xl p-12 text-center text-slate-400 border border-slate-200 dark:border-slate-700">No bookmarked lessons found. Click the bookmark icon on any lesson to save it here.</div>`;
                } else {
                    bookmarkedLessons.forEach(l => {
                        html += `
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 flex items-center justify-between gap-4 shadow-sm">
                                <div>
                                    <span class="text-xs font-semibold text-brand-600 dark:text-brand-400 uppercase tracking-wider">${Renderer.escape(l.subjectName)}</span>
                                    <h3 class="font-bold text-slate-900 dark:text-white mt-0.5">${Renderer.escape(l.title)}</h3>
                                </div>
                                <a href="#subject/${l.subjectId}/lesson/${l.id || l.title}" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl transition-colors shadow-sm">
                                    Read
                                </a>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;
                container.innerHTML = html;
            }

            static renderStatistics(container) {
                const progress = ProgressManager.getProgress();
                const totalQuizzes = progress.quizHistory.length;
                let avgScore = 0;
                if (totalQuizzes > 0) {
                    const sum = progress.quizHistory.reduce((acc, curr) => acc + curr.percentage, 0);
                    avgScore = Math.round(sum / totalQuizzes);
                }
                const completedCount = Object.keys(progress.completedLessons).filter(k => progress.completedLessons[k]).length;

                let html = `
                    <div class="max-w-4xl mx-auto space-y-6 pb-12">
                        <div>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Study Statistics</h1>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">Review your learning performance, streaks, and quiz history.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                                <div class="text-slate-400 text-sm font-medium">Study Streak</div>
                                <div class="text-3xl font-extrabold text-amber-500"><i class="fa-solid fa-fire mr-2"></i>${progress.streak.count} Days</div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                                <div class="text-slate-400 text-sm font-medium">Completed Lessons</div>
                                <div class="text-3xl font-extrabold text-slate-900 dark:text-white">${completedCount}</div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                                <div class="text-slate-400 text-sm font-medium">Average Quiz Score</div>
                                <div class="text-3xl font-extrabold text-brand-600 dark:text-brand-400">${avgScore}%</div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm space-y-4">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Quiz History</h2>
                `;

                if (totalQuizzes === 0) {
                    html += `<p class="text-slate-400 text-sm">No quizzes taken yet.</p>`;
                } else {
                    html += `<div class="space-y-3">`;
                    progress.quizHistory.slice().reverse().forEach(qh => {
                        html += `
                            <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                                <div>
                                    <div class="font-bold text-slate-900 dark:text-white">Subject Quiz: ${qh.subjectId}</div>
                                    <div class="text-xs text-slate-400 mt-0.5">${new Date(qh.date).toLocaleDateString()}</div>
                                </div>
                                <div class="text-lg font-bold text-brand-600 dark:text-brand-400">${qh.percentage}% (${qh.score}/${qh.total})</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `</div></div>`;
                container.innerHTML = html;
            }

            static renderSettings(container) {
                const currentTheme = StorageManager.get('theme', 'system');

                let html = `
                    <div class="max-w-2xl mx-auto space-y-6 pb-12">
                        <div>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Settings</h1>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">Configure your preferences and manage application data.</p>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm space-y-6">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white mb-2">Appearance Theme</h3>
                                <div class="grid grid-cols-3 gap-3">
                                    <button onclick="ThemeManager.apply('light'); Renderer.renderSettings(document.getElementById('main-viewport'));" class="p-4 rounded-2xl border ${currentTheme === 'light' ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/20 text-brand-600' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} font-medium text-center">Light</button>
                                    <button onclick="ThemeManager.apply('dark'); Renderer.renderSettings(document.getElementById('main-viewport'));" class="p-4 rounded-2xl border ${currentTheme === 'dark' ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/20 text-brand-600' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} font-medium text-center">Dark</button>
                                    <button onclick="ThemeManager.apply('system'); Renderer.renderSettings(document.getElementById('main-viewport'));" class="p-4 rounded-2xl border ${currentTheme === 'system' ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/20 text-brand-600' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} font-medium text-center">System</button>
                                </div>
                            </div>

                            <div class="pt-6 border-t border-slate-100 dark:border-slate-700">
                                <h3 class="font-bold text-slate-900 dark:text-white mb-2">Data Management</h3>
                                <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2.5 rounded-xl bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-semibold text-sm hover:bg-red-100 transition-colors">
                                    Reset All Progress & Data
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }

            static toggleBookmark(type, id) {
                BookmarksManager.toggleBookmark(type, id);
                // Re-render current view if possible or toggle UI element
                Router.handleRoute();
            }

            static toggleComplete(lessonId) {
                const progress = ProgressManager.getProgress();
                const isCompleted = !!progress.completedLessons[lessonId];
                ProgressManager.markLessonComplete(lessonId, !isCompleted);
                Router.handleRoute();
            }

            static escape(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return String(text).replace(/[&<>"']/g, m => map[m]);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!DataManager.validateAndInit()) return;

            ThemeManager.init();
            Router.init();

            // Mobile menu toggle
            const sidebar = document.getElementById('sidebar');
            document.getElementById('mobile-toggle').addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
            });
            document.getElementById('mobile-close-sidebar').addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
            });

            // Theme toggle button
            document.getElementById('theme-toggle').addEventListener('click', () => {
                ThemeManager.toggle();
            });

            // Search Modal
            const searchModal = document.getElementById('search-modal');
            const searchInput = document.getElementById('global-search-input');
            const searchResults = document.getElementById('search-results');

            document.getElementById('search-trigger').addEventListener('click', () => {
                searchModal.classList.remove('hidden');
                searchInput.focus();
            });
            document.getElementById('search-close').addEventListener('click', () => {
                searchModal.classList.add('hidden');
            });
            searchModal.addEventListener('click', (e) => {
                if (e.target === searchModal) searchModal.classList.add('hidden');
            });

            // Keyboard shortcut ⌘K / Ctrl+K
            window.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    searchModal.classList.remove('hidden');
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    searchModal.classList.add('hidden');
                }
            });

            // Instant Search Implementation
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    searchResults.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-compass text-3xl mb-2 opacity-40"></i><p class="text-sm">Start typing to search across all educational content.</p></div>`;
                    return;
                }

                const subjects = DataManager.getSubjects();
                let matches = [];

                subjects.forEach(sub => {
                    const subId = sub.id || sub.name;
                    if (sub.name.toLowerCase().includes(query) || (sub.description && sub.description.toLowerCase().includes(query))) {
                        matches.push({ type: 'Subject', title: sub.name, link: `#subject/${subId}`, snippet: sub.description || '' });
                    }
                    if (sub.lessons) {
                        sub.lessons.forEach(l => {
                            const lId = l.id || l.title;
                            if (l.title.toLowerCase().includes(query) || (l.content && l.content.toLowerCase().includes(query))) {
                                matches.push({ type: 'Lesson', title: l.title, link: `#subject/${subId}/lesson/${lId}`, snippet: l.description || sub.name });
                            }
                        });
                    }
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-face-frown text-3xl mb-2 opacity-40"></i><p class="text-sm">No results found for "${Renderer.escape(query)}".</p></div>`;
                    return;
                }

                let html = '';
                matches.slice(0, 15).forEach(m => {
                    html += `
                        <div onclick="searchModal.classList.add('hidden'); window.location.hash='${m.link}';" class="p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 cursor-pointer transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-600">
                            <div class="flex items-center space-x-2 text-xs font-semibold text-brand-600 dark:text-brand-400 uppercase tracking-wider">
                                <i class="fa-solid fa-bookmark"></i>
                                <span>${m.type}</span>
                            </div>
                            <div class="font-bold text-slate-900 dark:text-white mt-0.5">${Renderer.escape(m.title)}</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">${Renderer.escape(m.snippet)}</div>
                        </div>
                    `;
                });
                searchResults.innerHTML = html;
            });
        });
    </script>
</body>
</html>
